<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZENN Architecture</title>
<link rel="stylesheet" href="common.css">
<style>
  .box { fill: #262624; stroke: #4a4a45; stroke-width: 1.5; rx: 10; }
  .btxt { fill: var(--ink); font-size: 20px; text-anchor: middle; dominant-baseline: middle; }
  .small { fill: var(--ink-2); font-size: 15px; text-anchor: middle; }
  .edge { fill: none; stroke: #4a4a45; stroke-width: 2; }
  .flow { fill: none; stroke-width: 3; stroke-dasharray: 6 16; opacity: 0; }
  .on .flow { opacity: 1; animation: flow 0.9s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -22; } }
  .stage { transition: opacity .45s; opacity: .22; }
  .stage.on { opacity: 1; }
  .stage.on .box { stroke: var(--accent); }
  .val { fill: var(--ink); font-size: 17px; font-variant-numeric: tabular-nums; text-anchor: middle; }
  #caption { font-size: 22px; color: var(--ink); min-height: 32px; }
  #caption b { color: var(--accent); font-weight: 600; }
  .dots span { display:inline-block; width:10px; height:10px; border-radius:50%; background:#3a3a37; margin-right:6px; }
  .dots span.on { background: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content: space-between">
    <div id="caption"></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="grow"><svg id="svg"></svg></div>
  <div class="controls">
    <button id="prev">◀ Back</button>
    <button id="next">Next ▶</button>
    <span style="margin-left:18px">x</span>
    <input id="x" type="range" min="-180" max="180" value="20" style="max-width:220px">
    <span>T</span>
    <input id="T" type="range" min="10" max="200" value="40">
    <span class="readout" id="read"></span>
  </div>
</div>
<script src="common.js"></script>
<script>
// The true 3-configuration model from the video example (truth.py)
const A = 1.0, DE = 2.0, DS = 3.0;
const ES = (x) => [[A * (x + 1) ** 2, 0], [A * (x - 1) ** 2, 0], [A * x * x + DE, DS]];
const cols = [COLORS.L, COLORS.R, COLORS.D];
const svg = document.getElementById("svg");
svg.setAttribute("viewBox", "0 0 1180 560");

const stages = [
  "<b>Input:</b> features x, plus a temperature T",
  "<b>K configuration networks:</b> each predicts an energy E<sub>k</sub>(x,T) and an entropy S<sub>k</sub>(x,T) ≥ 0",
  "<b>Per-configuration free energy:</b> F<sub>k</sub> = E<sub>k</sub> − T·S<sub>k</sub>",
  "<b>Boltzmann weights:</b> p<sub>k</sub> = e<sup>−F<sub>k</sub>/kT</sup> / Z   (a softmax whose sharpness is set by T)",
  "<b>Zentropy total:</b> F = Σ p<sub>k</sub>F<sub>k</sub> + kT Σ p<sub>k</sub> ln p<sub>k</sub>   (= −kT ln Z)",
  "<b>Compare a plain NN:</b> (x, T) go into one black box. No E, no S, no T-controlled mixing.",
];
const S = stages.map((_, i) => el("g", { class: "stage", id: "s" + i }, svg));
const rowY = [110, 245, 380];

// stage 0: inputs
for (const [lab, y] of [["x", 180], ["T", 310]]) {
  el("circle", { cx: 70, cy: y, r: 34, class: "box" }, S[0]);
  el("text", { x: 70, y, class: "btxt", "font-size": 24 }, S[0]).textContent = lab;
}
const vx = el("text", { x: 70, y: 236, class: "val" }, S[0]);
const vT = el("text", { x: 70, y: 366, class: "val" }, S[0]);

// stage 1: E/S networks per config
const vE = [], vS = [], vF = [], bars = [], vp = [];
rowY.forEach((y, k) => {
  for (const yy of [180, 310]) {
    el("path", { d: `M104,${yy} C170,${yy} 170,${y} 220,${y}`, class: "edge" }, S[1]);
    el("path", { d: `M104,${yy} C170,${yy} 170,${y} 220,${y}`, class: "flow", stroke: cols[k] }, S[1]);
  }
  el("rect", { x: 220, y: y - 48, width: 190, height: 96, class: "box" }, S[1]);
  el("rect", { x: 220, y: y - 48, width: 8, height: 96, fill: cols[k], rx: 3 }, S[1]);
  el("text", { x: 318, y: y - 22, class: "btxt" }, S[1]).innerHTML = `E-net<tspan font-size="14" dy="5">${k + 1}</tspan>`;
  el("text", { x: 318, y: y + 20, class: "btxt" }, S[1]).innerHTML = `S-net<tspan font-size="14" dy="5">${k + 1}</tspan>`;
  vE.push(el("text", { x: 440, y: y - 18, class: "val", "text-anchor": "start" }, S[1]));
  vS.push(el("text", { x: 440, y: y + 24, class: "val", "text-anchor": "start" }, S[1]));

  // stage 2: F_k
  el("path", { d: `M410,${y} L560,${y}`, class: "edge" }, S[2]);
  el("path", { d: `M410,${y} L560,${y}`, class: "flow", stroke: cols[k] }, S[2]);
  el("rect", { x: 560, y: y - 34, width: 150, height: 68, class: "box" }, S[2]);
  el("text", { x: 635, y: y - 10, class: "btxt" }, S[2]).innerHTML = `F<tspan font-size="14" dy="5">${k + 1}</tspan>`;
  vF.push(el("text", { x: 635, y: y + 20, class: "val" }, S[2]));

  // stage 3: p_k bars
  el("path", { d: `M710,${y} L780,${y}`, class: "edge" }, S[3]);
  el("path", { d: `M710,${y} L780,${y}`, class: "flow", stroke: cols[k] }, S[3]);
  el("rect", { x: 780, y: y - 26, width: 160, height: 52, class: "box" }, S[3]);
  bars.push(el("rect", { x: 784, y: y - 22, width: 0, height: 44, fill: cols[k], rx: 4 }, S[3]));
  vp.push(el("text", { x: 860, y: y + 52, class: "val" }, S[3]));

  // stage 4: sum
  el("path", { d: `M940,${y} C990,${y} 990,245 1030,245`, class: "edge" }, S[4]);
  el("path", { d: `M940,${y} C990,${y} 990,245 1030,245`, class: "flow", stroke: cols[k] }, S[4]);
});
el("text", { x: 860, y: 40, class: "small" }, S[3]).textContent = "p_k  (softmax of −F_k/kT)";
el("circle", { cx: 1080, cy: 245, r: 50, class: "box" }, S[4]);
el("text", { x: 1080, y: 238, class: "btxt" }, S[4]).textContent = "F";
const vTot = el("text", { x: 1080, y: 266, class: "val" }, S[4]);

// stage 5: plain NN strip
const g5 = S[5];
el("rect", { x: 20, y: 470, width: 1140, height: 80, rx: 12, fill: "#202020", stroke: "#3987e5", "stroke-dasharray": "6 6" }, g5);
el("text", { x: 120, y: 512, class: "btxt" }, g5).textContent = "plain NN:  (x, T)";
el("path", { d: "M215,510 L420,510", class: "edge" }, g5);
el("path", { d: "M215,510 L420,510", class: "flow", stroke: COLORS.mlp }, g5);
el("rect", { x: 420, y: 482, width: 300, height: 56, rx: 10, fill: "#0e0e0e", stroke: "#3987e5" }, g5);
el("text", { x: 570, y: 511, class: "btxt" }, g5).textContent = "black box (64×64 tanh)";
el("path", { d: "M720,510 L900,510", class: "edge" }, g5);
el("path", { d: "M720,510 L900,510", class: "flow", stroke: COLORS.mlp }, g5);
el("text", { x: 960, y: 512, class: "btxt" }, g5).textContent = "F";

let stage = 0;
const dots = document.getElementById("dots");
stages.forEach(() => dots.appendChild(document.createElement("span")));
function setStage(s) {
  stage = Math.max(0, Math.min(stages.length - 1, s));
  S.forEach((g, i) => g.classList.toggle("on", stage === 5 ? i === 5 || i < 5 : i <= stage));
  if (stage === 5) S.slice(0, 5).forEach(g => g.style.opacity = 0.35); else S.forEach(g => g.style.opacity = "");
  document.getElementById("caption").innerHTML = stages[stage];
  [...dots.children].forEach((d, i) => d.classList.toggle("on", i <= stage));
}
function values() {
  const x = +document.getElementById("x").value / 100, T = +document.getElementById("T").value / 100;
  const es = ES(x), F = es.map(([E, s]) => E - T * s);
  const m = Math.min(...F), w = F.map(f => Math.exp(-(f - m) / T)), Z = w.reduce((a, b) => a + b);
  const p = w.map(v => v / Z), Ftot = m - T * Math.log(Z);
  vx.textContent = x.toFixed(2); vT.textContent = T.toFixed(2);
  es.forEach(([E, s], k) => {
    vE[k].textContent = `E = ${E.toFixed(2)}`; vS[k].textContent = `S = ${s.toFixed(2)}`;
    vF[k].textContent = F[k].toFixed(2);
    bars[k].setAttribute("width", 152 * p[k]);
    vp[k].textContent = p[k].toFixed(2);
  });
  vTot.textContent = Ftot.toFixed(2);
  document.getElementById("read").textContent = `x = ${x.toFixed(2)}, T = ${T.toFixed(2)}`;
}
document.getElementById("next").onclick = () => setStage(stage + 1);
document.getElementById("prev").onclick = () => setStage(stage - 1);
document.getElementById("x").oninput = values;
document.getElementById("T").oninput = values;
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); setStage(stage + 1); }
  if (e.code === "ArrowLeft") { e.preventDefault(); setStage(stage - 1); }
});
setStage(0); values();
</script>
</body>
</html>
